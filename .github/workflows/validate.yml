name: Validate project
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: |
            requirements.txt
            deployment/requirements-dashboard-lock.txt
            deployment/requirements-analysis-lock.txt
      - run: python -m pip install -r deployment/requirements-analysis-lock.txt
      - run: python -m unittest discover -s analysis/tests -v
      - run: python deployment/validate_package.py
      - run: python deployment/verify_analysis.py
